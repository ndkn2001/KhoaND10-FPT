
name: Build KhoaND10 FPT APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source ZIP
        run: unzip -q KhoaND10_FPT_Android_Source.zip -d extracted

      - name: Build Android APK
        run: |
          cd extracted/KhoaND10_FPT_Android
          gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: KhoaND10-FPT-APK
          path: extracted/KhoaND10_FPT_Android/app/build/outputs/apk/debug/app-debug.apk
